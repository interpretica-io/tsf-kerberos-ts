# The engine and the agent are built for the same platform: the agent runs
# on the engine host. tapi_kerberos drives MIT krb5 over the agent's RPC
# server, so the suite has a real agent with an RPC server, and the krb5
# library lives in that server.
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             ta_job tapi_job tapi_tool \
             netconf rpctransport agentlib loggerta comm_net_agent rpcs_job \
             rpcserver rcfpch tad])

# The external libraries under test. tapi_kerberos's posture reports
# through tapi_cybersec, which is built on tapi_kernel, which is built on
# tapi_devtool - so the chain is pulled in, engine-side only; only
# tsf_kerberos has agent-side libraries (ta_kerberos, rpcs_kerberos),
# listed again in the RPC server application below.
TE_EXT_REPO_USE([tsf_devtool], [], [tapi_devtool])
TE_EXT_REPO_USE([tsf_kernel], [], [tapi_kernel])
TE_EXT_REPO_USE([tsf_cybersec], [], [tapi_cybersec])
TE_EXT_REPO_USE([tsf_kerberos], [], [ta_kerberos rpcs_kerberos tapi_kerberos])

# The krb5_* RPCs. The platform is shared by engine and agent, so one
# declaration wires rpcxdr (engine) and rpcxdrta (agent) both. See
# ta_kerberos/krb5_rpc.x.m4.
TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4,../ta_kerberos/krb5_rpc.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# The traffic engine (tapi_cybersec sniff rules use it) restricted to the
# protocols needed; without this the meson build pulls the full default set,
# which includes SNMP and is unsupported under meson.
TE_LIB_PARMS([tapi_tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])
TE_LIB_PARMS([tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# One Test Agent of the stock unix flavour.
TE_TA_TYPE([linux], [], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [], [comm_net_agent rcfpch ndn asn])

# The RPC server application. tapi_kerberos's RPCs run here, so it links
# the agent-side ta_kerberos (MIT krb5 client) and rpcs_kerberos (the
# krb5_* RPCs) on top of the stock RPC server. The agent host must carry
# libkrb5 with its development headers; see the tsf-kerberos README.
TE_TA_APP([ta_rpcprovider], [], [linux],
          [ta_rpcprovider], [], [],
          [ta_kerberos rpcs_kerberos \
           conf_oid ta_job comm_net_agent rpcs_job rpcserver agentlib rpcxdrta \
           rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh --extra-deps='libpcre2-8 krb5 krb5-gssapi'],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper
